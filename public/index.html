<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fina - GoPay Style</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        .nav-active {
            color: #0081a0;
            font-weight: 700;
            transform: scale(1.05);
        }
        .nav-inactive {
            color: #9ca3af;
            font-weight: 500;
        }
        .gopay-blue { background-color: #0081a0; }
        .gopay-text { color: #0081a0; }

        /* Animasi Transisi Halus */
        .fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-full">

    <!-- ================= LAYAR LOGIN ================= -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen hidden px-4 bg-gray-50">
        <div class="bg-white p-8 rounded-3xl shadow-sm w-full max-w-sm border border-gray-100 fade-in">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce">
                    <span class="text-3xl font-bold gopay-text">$</span>
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Login ke Fina</h2>
                <p class="text-sm text-gray-500 mt-2">Masukkan nomor WA kamu.</p>
            </div>
            
            <div id="phone-form">
                <input type="text" id="wa-number" placeholder="08123xxx" class="w-full px-4 py-3 rounded-2xl bg-gray-50 border border-gray-200 text-gray-900 focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 mb-4 transition-all">
                <button onclick="requestOTP()" class="w-full gopay-blue hover:bg-cyan-700 text-white font-bold py-3 rounded-2xl transition-all shadow-md active:scale-95">
                    Lanjut
                </button>
            </div>
            
            <div id="otp-form" class="hidden mt-4 fade-in">
                <div class="p-3 bg-green-50 text-green-700 rounded-xl text-sm mb-4 text-center border border-green-100">
                    OTP terkirim ke WhatsApp kamu!
                </div>
                <input type="text" id="otp-code" placeholder="XXXXXX" class="w-full px-4 py-3 rounded-2xl bg-gray-50 border border-gray-200 text-gray-900 focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 mb-4 text-center tracking-[0.5em] text-lg font-bold uppercase">
                <button onclick="verifyOTP()" class="w-full gopay-blue hover:bg-cyan-700 text-white font-bold py-3 rounded-2xl transition-all shadow-md active:scale-95">
                    Konfirmasi
                </button>
            </div>
        </div>
    </div>

    <!-- ================= LAYAR APLIKASI (TABS) ================= -->
    <!-- PERBAIKAN UTAMA: Menggunakan min-h-screen & padding bawah agar nav bar tidak tertutup browser -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-xl relative pb-28">
        
        <!-- Header Global -->
        <header class="px-5 py-4 bg-white/80 backdrop-blur-md flex justify-between items-center sticky top-0 z-30 border-b border-gray-100">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full gopay-blue flex items-center justify-center text-white font-bold text-sm shadow-sm">F</div>
                <h1 class="font-bold text-base text-gray-900" id="greeting">Halo!</h1>
            </div>
            <div class="flex items-center gap-2">
                <!-- Indikator Live Sync -->
                <span class="flex h-2.5 w-2.5 relative" title="Auto-sync aktif">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                </span>
                <button onclick="logout()" class="text-xs font-semibold text-red-500 bg-red-50 px-3 py-1.5 rounded-full hover:bg-red-100 transition-colors">Keluar</button>
            </div>
        </header>

        <!-- Kontainer Konten -->
        <main class="flex-1 bg-gray-50" id="main-content">
            
            <!-- TAMPILAN: UTAMA (TENGAH) -->
            <div id="tab-utama" class="p-5 fade-in hidden">
                <!-- Navigasi Bulan -->
                <div class="flex justify-between items-center bg-white p-2 rounded-full shadow-sm mb-5 border border-gray-100">
                    <button onclick="changeMonth(-1)" class="w-9 h-9 flex items-center justify-center rounded-full bg-gray-50 hover:bg-gray-100 text-gray-600 font-bold transition-transform active:scale-90">&lt;</button>
                    <span id="month-display" class="font-bold text-gray-800 text-sm">Agustus 2026</span>
                    <button onclick="changeMonth(1)" class="w-9 h-9 flex items-center justify-center rounded-full bg-gray-50 hover:bg-gray-100 text-gray-600 font-bold transition-transform active:scale-90">&gt;</button>
                </div>

                <!-- Kartu Saldo (Kumulatif) -->
                <div class="gopay-blue rounded-3xl p-6 text-white shadow-lg mb-5 relative overflow-hidden transition-all duration-300 hover:scale-[1.01]">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-white opacity-10 rounded-full -mr-10 -mt-10 pointer-events-none"></div>
                    <p class="text-blue-100 text-xs font-medium mb-1">Total Saldo Saat Ini</p>
                    <h2 class="text-4xl font-extrabold tracking-tight mb-4" id="currentBalance">Rp 0</h2>
                    <div class="flex items-center gap-1.5 text-[11px] text-blue-100 bg-black/20 px-3 py-1 rounded-full w-fit backdrop-blur-sm">
                        <span>✨ Termasuk akumulasi sisa bulan lalu</span>
                    </div>
                </div>

                <!-- Pemasukan & Pengeluaran Bulan Ini -->
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 transition-all hover:shadow-md">
                        <div class="w-8 h-8 rounded-full bg-green-50 text-green-600 flex items-center justify-center mb-2 font-bold">↓</div>
                        <p class="text-xs text-gray-400 font-semibold">Masuk Bulan Ini</p>
                        <p class="text-base font-bold text-gray-900 mt-1" id="monthIncome">Rp 0</p>
                    </div>
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 transition-all hover:shadow-md">
                        <div class="w-8 h-8 rounded-full bg-red-50 text-red-600 flex items-center justify-center mb-2 font-bold">↑</div>
                        <p class="text-xs text-gray-400 font-semibold">Keluar Bulan Ini</p>
                        <p class="text-base font-bold text-gray-900 mt-1" id="monthExpense">Rp 0</p>
                    </div>
                </div>
            </div>

            <!-- TAMPILAN: PENGELUARAN (KIRI) -->
            <div id="tab-pengeluaran" class="p-5 fade-in hidden">
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 mb-5">
                    <h3 class="font-bold text-gray-900 mb-0.5">Statistik Kategori</h3>
                    <p class="text-xs text-gray-400 mb-5" id="stat-month-display">Bulan ...</p>
                    
                    <div class="relative h-48 w-full flex justify-center mb-6">
                        <canvas id="categoryChart"></canvas>
                        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none mt-2">
                            <span class="text-[10px] text-gray-400 font-semibold">Total Pengeluaran</span>
                            <span class="text-sm font-bold text-gray-800" id="chart-total">Rp 0</span>
                        </div>
                    </div>
                    
                    <div id="category-list" class="space-y-3">
                        <!-- Render kategori -->
                    </div>
                </div>
            </div>

            <!-- TAMPILAN: RIWAYAT (KANAN) -->
            <div id="tab-riwayat" class="p-5 fade-in hidden">
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 min-h-[50vh]">
                    <h3 class="font-bold text-gray-900 mb-4">Semua Riwayat Transaksi</h3>
                    <ul id="history-list" class="space-y-3">
                        <!-- Render riwayat -->
                    </ul>
                </div>
            </div>

        </main>

        <!-- BOTTOM NAVIGATION BAR (PERBAIKAN POSISI AGAR TIDAK TERPOTONG) -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t border-gray-100 flex justify-between px-8 py-3.5 z-40 shadow-lg">
            <button onclick="switchTab('pengeluaran')" id="nav-pengeluaran" class="flex flex-col items-center gap-1 nav-inactive transition-all duration-200 w-1/3">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
                <span class="text-[10px]">Pengeluaran</span>
            </button>
            <button onclick="switchTab('utama')" id="nav-utama" class="flex flex-col items-center gap-1 nav-active transition-all duration-200 w-1/3">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[10px]">Utama</span>
            </button>
            <button onclick="switchTab('riwayat')" id="nav-riwayat" class="flex flex-col items-center gap-1 nav-inactive transition-all duration-200 w-1/3">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span class="text-[10px]">Riwayat</span>
            </button>
        </nav>
    </div>

    <!-- ================= LOGIKA APLIKASI & AUTO-REFRESH ================= -->
    <script>
        const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
        
        let allTransactions = [];
        let viewDate = new Date();
        let myDoughnutChart = null;
        let activeTab = 'utama';
        const chartColors = ['#0081a0', '#00aa5b', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'];

        window.onload = () => {
            const userPhone = localStorage.getItem('fina_user_phone');
            if (userPhone) {
                showApp();
                loadData(userPhone, false); // Load pertama tanpa kedip animasi berat
                
                // --- FITUR AUTO-REFRESH (POLLING REAL-TIME TIAP 3 DETIK) ---
                setInterval(() => {
                    const currentPhone = localStorage.getItem('fina_user_phone');
                    if (currentPhone) {
                        loadData(currentPhone, true); // true = silent background update
                    }
                }, 3000);
            } else {
                showLogin();
            }
        };

        async function requestOTP() {
            const phone = document.getElementById('wa-number').value;
            if (!phone) return alert("Isi nomor WA dulu bos!");
            try {
                const res = await fetch('/api/request-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const data = await res.json();
                if (data.error) alert(data.error);
                else {
                    document.getElementById('phone-form').classList.add('hidden');
                    document.getElementById('otp-form').classList.remove('hidden');
                }
            } catch (err) { alert("Gagal konek ke server."); }
        }

        async function verifyOTP() {
            const phone = document.getElementById('wa-number').value;
            const otp = document.getElementById('otp-code').value.toUpperCase();
            if (!otp) return alert("Masukkan OTP nya!");
            try {
                const res = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, otp })
                });
                const data = await res.json();
                if (data.error) alert(data.error);
                else {
                    localStorage.setItem('fina_user_phone', data.phone);
                    showApp();
                    loadData(data.phone, false);
                }
            } catch (err) { alert("Gagal verifikasi OTP."); }
        }

        function logout() {
            localStorage.removeItem('fina_user_phone');
            location.reload(); 
        }

        function showLogin() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
        }

        function showApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            switchTab('utama');
        }

        function switchTab(tabName) {
            activeTab = tabName;
            ['pengeluaran', 'utama', 'riwayat'].forEach(name => {
                document.getElementById('tab-' + name).classList.add('hidden');
                const nav = document.getElementById('nav-' + name);
                nav.classList.replace('nav-active', 'nav-inactive');
            });
            
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            const activeNav = document.getElementById('nav-' + tabName);
            activeNav.classList.replace('nav-inactive', 'nav-active');

            if (tabName === 'pengeluaran') renderPengeluaran();
        }

        async function loadData(phone, isSilent = false) {
            try {
                const res = await fetch(`/api/data?phone=${phone}`);
                const data = await res.json();

                if (data.error) {
                    if (!isSilent) {
                        alert(data.error);
                        logout();
                    }
                    return;
                }

                const shortName = data.name.split(' ')[0];
                document.getElementById('greeting').innerText = `Halo, ${shortName}!`;

                const newTransactions = data.transactions.sort((a, b) => new Date(a.date) - new Date(b.date));
                
                // Cek apakah ada perubahan data baru secara real-time
                const isDataChanged = JSON.stringify(newTransactions) !== JSON.stringify(allTransactions);
                
                if (isDataChanged || !isSilent) {
                    allTransactions = newTransactions;
                    updateView();
                    renderRiwayat();
                    if (activeTab === 'pengeluaran') renderPengeluaran();
                }
            } catch (err) {
                console.error("Auto-sync error", err);
            }
        }

        function changeMonth(offset) {
            viewDate.setMonth(viewDate.getMonth() + offset);
            updateView();
        }

        function getMonthString(dateObj) {
            const yyyy = dateObj.getFullYear();
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            return `${yyyy}-${mm}`;
        }

        function updateView() {
            const options = { month: 'long', year: 'numeric' };
            const monthText = viewDate.toLocaleDateString('id-ID', options);
            document.getElementById('month-display').innerText = monthText;
            document.getElementById('stat-month-display').innerText = `Bulan ${monthText}`;

            const viewMonthStr = getMonthString(viewDate);

            let cumulativeBalance = 0;
            let monthIncome = 0;
            let monthExpense = 0;

            allTransactions.forEach(trx => {
                const trxMonthStr = trx.date.substring(0, 7);
                if (trxMonthStr <= viewMonthStr) {
                    if (trx.type === 'income') cumulativeBalance += trx.amount;
                    if (trx.type === 'expense') cumulativeBalance -= trx.amount;
                }
                if (trxMonthStr === viewMonthStr) {
                    if (trx.type === 'income') monthIncome += trx.amount;
                    if (trx.type === 'expense') monthExpense += trx.amount;
                }
            });

            document.getElementById('currentBalance').innerText = formatRp(cumulativeBalance);
            document.getElementById('monthIncome').innerText = formatRp(monthIncome);
            document.getElementById('monthExpense').innerText = formatRp(monthExpense);
        }

        function renderPengeluaran() {
            const viewMonthStr = getMonthString(viewDate);
            const categoryData = {};
            let totalBulanIni = 0;

            allTransactions.forEach(trx => {
                const trxMonthStr = trx.date.substring(0, 7);
                if (trxMonthStr === viewMonthStr && trx.type === 'expense') {
                    const cat = trx.category || 'Lainnya';
                    categoryData[cat] = (categoryData[cat] || 0) + trx.amount;
                    totalBulanIni += trx.amount;
                }
            });

            document.getElementById('chart-total').innerText = formatRp(totalBulanIni);

            const labels = Object.keys(categoryData);
            const dataValues = Object.values(categoryData);
            
            const ctx = document.getElementById('categoryChart').getContext('2d');
            if (myDoughnutChart) myDoughnutChart.destroy();

            if (labels.length === 0) {
                document.getElementById('category-list').innerHTML = '<p class="text-center text-gray-400 text-sm py-4">Tidak ada pengeluaran bulan ini.</p>';
                return;
            }

            myDoughnutChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        backgroundColor: chartColors.slice(0, labels.length),
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '75%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) { return ' ' + formatRp(context.raw); }
                            }
                        }
                    }
                }
            });

            const listHtml = labels.map((cat, index) => {
                const amount = categoryData[cat];
                const percentage = Math.round((amount / totalBulanIni) * 100);
                const color = chartColors[index % chartColors.length];
                return `
                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded-2xl border border-gray-100 transition-all hover:bg-gray-100">
                        <div class="flex items-center gap-3">
                            <span class="w-3 h-3 rounded-full shadow-sm" style="background-color: ${color}"></span>
                            <span class="font-semibold text-gray-700 text-sm">${cat}</span>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-gray-900 text-sm">${formatRp(amount)}</p>
                            <p class="text-[10px] text-gray-400 font-medium">${percentage}%</p>
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('category-list').innerHTML = listHtml;
        }

        function renderRiwayat() {
            const listContainer = document.getElementById('history-list');
            listContainer.innerHTML = '';

            const reversedTransactions = [...allTransactions].reverse();

            if (reversedTransactions.length === 0) {
                listContainer.innerHTML = '<li class="text-gray-400 text-sm text-center py-4">Belum ada catatan transaksi.</li>';
                return;
            }

            reversedTransactions.forEach(trx => {
                const isExpense = trx.type === 'expense';
                const emoji = trx.emoji || (isExpense ? '📉' : '📈');
                const category = trx.category || 'Lainnya';
                
                listContainer.innerHTML += `
                    <li class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl border border-gray-100 transition-all hover:scale-[1.01]">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-white rounded-full shadow-sm flex items-center justify-center text-xl border border-gray-100">
                                ${emoji}
                            </div>
                            <div>
                                <p class="font-bold text-gray-900 text-sm">${trx.item}</p>
                                <p class="text-[10px] text-gray-400 mt-0.5">${trx.date} • <span class="text-cyan-600 font-semibold">${category}</span></p>
                            </div>
                        </div>
                        <span class="font-bold tracking-tight ${isExpense ? 'text-gray-900' : 'text-green-600'}">
                            ${isExpense ? '-' : '+'}${formatRp(trx.amount)}
                        </span>
                    </li>
                `;
            });
        }
    </script>
</body>
</html>
